kind = "web"
previewPath = "/"
title = "Tonight GC"
version = "1.0.0"
id = "artifacts/tonight-gc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25988

[services.development]
run = "pnpm --filter @workspace/tonight-gc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tonight-gc", "run", "build" ]
publicDir = "artifacts/tonight-gc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25988"
BASE_PATH = "/"
